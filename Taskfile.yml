version: '3'

vars:
  PRESET: default
  BUILD_DIR: build

tasks:
  configure:
    desc: Configure the CMake build using a configure preset
    cmds:
      - cmake --preset {{.PRESET}}

  build:
    desc: Build all targets using a build preset
    cmds:
      - cmake --build {{.BUILD_DIR}}

  run:
    desc: Build then run the app
    cmds:
      - "{{.BUILD_DIR}}/app/app"

  clean:
    desc: Remove the build directory
    cmds:
      - rm -rf {{.BUILD_DIR}}
